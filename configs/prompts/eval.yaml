# configs/prompts/eval.yaml
# 评测/数据生成 Prompt 集合
# ============================================================

meta:
  domain: eval
  description: "评估数据生成 Prompt"
  maintainer: eval-team

prompts:

  # ── P10: 评测查询生成 ────────────────────────────────

  eval.query_generation:
    description: "评测数据生成 — 根据文档内容生成用户可能提出的查询问题"
    owner: eval
    current_version: v1
    versions:
      v1:
        created_at: "2026-07-06"
        changelog: "初始版本 — 从 generate_eval_data.py PROMPT_TEMPLATE 迁移"
        variables:
          - content
        template: |
          你是一个金融助手。

          给定一段文档内容，请生成 2 个用户可能提出的查询问题。

          要求：
          1. 问题必须自然
          2. 与内容强相关
          3. 用中文

          文档：
          {content}

          输出 JSON：
          [
            {{"query": "..."}},
            {{"query": "..."}}
          ]
