# configs/prompts/text2sql.yaml
# Text2SQL 服务的 Prompt 集合
# ============================================================

meta:
  domain: text2sql
  description: "Text2SQL 服务 — SQL 生成与错误修正 Prompt"
  maintainer: text2sql-team

prompts:

  # ── P1: 首次 SQL 生成 ────────────────────────────────

  text2sql.first_attempt:
    description: "首次 SQL 生成 — 根据用户问题 + Schema 上下文生成 SELECT 语句"
    owner: text2sql
    current_version: v1
    versions:
      v1:
        created_at: "2026-07-06"
        changelog: "初始版本 — 从 prompt_builder.py 硬编码迁移"
        variables:
          - schema_prompt
          - question
          - current_year
        template: |
          你是一个专业的 SQL 生成助手。根据用户问题和可用的数据库 Schema，生成正确的 SQL 查询。

          {schema_prompt}

          ## 用户问题
          {question}

          ## 要求
          - 只生成 SELECT 语句
          - 必须包含 LIMIT 子句
          - 表名和列名必须来自上面列出的可用字段
          - 如果有不确定的列名，优先选择最匹配的
          - 年份筛选使用 fiscal_year 字段，如 fiscal_year = {current_year}
          - 季度筛选使用 quarter 字段 (1=Q1, 2=Q2, 3=Q3, 4=Q4)，如 quarter = 1
          - "近N年各季度" 查询需要同时筛选 fiscal_year 和 quarter，按 fiscal_year, quarter 排序
          - 同比计算: 当前季度 vs 去年同季度 (fiscal_year 减1, quarter 相同)
          - 环比计算: 当前季度 vs 上一季度 (同一年 quarter-1，或上一年 Q4)
          - 公司名筛选使用 company_name 字段，支持模糊匹配 LIKE '%公司名%'
          - 当前年份为 {current_year}
          - 直接输出 SQL 代码，不要任何解释，不要 markdown 代码块标记

  # ── P2: SQL 错误修正 ──────────────────────────────────

  text2sql.retry:
    description: "SQL 错误修正 — 根据上次 SQL + 数据库报错信息修正查询"
    owner: text2sql
    current_version: v1
    versions:
      v1:
        created_at: "2026-07-06"
        changelog: "初始版本 — 从 prompt_builder.py 硬编码迁移"
        variables:
          - schema_prompt
          - question
          - last_sql
          - error
        template: |
          上一次生成的 SQL 执行失败。

          {schema_prompt}

          ## 用户问题
          {question}

          ## 上一次 SQL
          ```sql
          {last_sql}
          ```

          ## 数据库错误
          {error}

          ## 要求
          - 根据错误信息修正 SQL
          - 只生成 SELECT 语句
          - 必须包含 LIMIT 子句
          - 直接输出修正后的 SQL 代码，不要任何解释，不要 markdown 代码块标记
