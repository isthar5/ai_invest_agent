# Report Generation Workflow
# ============================================================
# Synthesizer 的 LLM 生成阶段。
# Fusion / PromptBuilder / Memory 保留在 Node 中。
# 仅替换 client.chat.completions.create() 调用。

meta:
  version: "1.0"
  description: "Report Generation — 可扩展 LLM 生成流水线"

tasks:

  # Stage 0: 主生成
  generate:
    executor: llm
    config:
      model: deepseek-chat
      temperature: 0.3
      max_tokens: 2000
      # messages 由 Synthesizer 通过 WorkflowService.run() 注入
      # 不在此声明 prompt_id — 避免与 PromptBuilder 双入口

