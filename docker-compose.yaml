version: '3.8'

services:
  # 1. 向量数据库 (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chem_qdrant
    ports:
      - "6333:6333"
    volumes:
      # 确保向量数据持久化在 E 盘
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  # 2. 投研 Agent API
  chem_agent:
    build: .
    container_name: chem_agent
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - TEXT2SQL_DB_URL=sqlite:////app/data/chemical_stocks.db
      - HF_HOME=/app/data/hf_cache
    volumes:
      - .:/app
      - ./data/annual_reports:/app/data/annual_reports
      - ./data/chemical_stocks.db:/app/data/chemical_stocks.db
      - ./data/qdrant_storage:/app/data/qdrant_storage
    depends_on:
      - qdrant
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always

  # 3. Redis（Memory / Rate Limiter 共享）
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always